name: 每日抓取科研通知

# 流程：抓官方列表页 → 生成包内数据 → 生成远程数据文件 → 提交 → 同步云数据库 → （可选）上传体验版
#
# 三条到达用户手机的路径（现在默认走第 1 条）：
#  1) GitHub Pages 静态 JSON（默认，最轻）：docs/data/notices.json 提交后由 Pages 发布，
#     小程序用 wx.request 直连拉取。只要 jason07didi.github.io 进了
#     【开发管理 → 开发设置 → 服务器域名 → request 合法域名】，就能每天自动更新，
#     不用重新上传版本、不用等审核、也不用云开发。
#  2) 云数据库（可选，配了 TCB_* 密钥才走）：写入 notices 集合。
#  3) 包内数据（兜底）：写进 utils/data_crawl.js，需要重新上传 + 审核。
#
# 说明：
#  - 截止日铁律：列表页日期是「发布日」，不是「截止日」，
#    抓到的条目 deadline 一律留空，落在首页「日期待定」段，等人工核实。
#  - Pages 源要设成 main 分支 /docs 目录，否则 docs/data/notices.json 不会被发布。

on:
  # 每天北京时间 07:30（GitHub cron 用 UTC，07:30 CST = 前一日 23:30 UTC）
  schedule:
    - cron: "30 23 * * *"

  # 支持手动触发（改完爬虫逻辑想立刻验证时用）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-crawl
  cancel-in-progress: true

jobs:
  crawl-and-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 抓取官方通知列表页
        run: node tools/local_spider.js

      - name: 生成小程序包内数据
        run: node tools/build_pack.js

      - name: 生成远程数据文件（GitHub Pages 用）
        run: node tools/build_remote.js

      - name: 检查生成结果
        run: |
          if [ ! -f "utils/data_crawl.js" ]; then
            echo "ERROR: utils/data_crawl.js 未生成"
            exit 1
          fi
          if [ ! -f "docs/data/notices.json" ]; then
            echo "ERROR: docs/data/notices.json 未生成"
            exit 1
          fi
          node -e "const d=require('./utils/data_crawl.js');console.log('整理日期',d.UPDATED_AT,'条目',(d.ITEMS||[]).length)"
          node -e "const j=require('./docs/data/notices.json');console.log('远程文件 v'+j.v,'更新于',j.updatedAt,'条目',j.count,'有截止日',j.datedCount)"

      - name: 数据质量守卫
        id: guard
        run: node tools/guard_remote.js

      - name: 同步到云数据库
        id: tcb
        if: steps.guard.outputs.degraded != 'true'
        run: |
          if [ -z "${{ secrets.TCB_ENV }}" ] || [ -z "${{ secrets.TCB_SECRET_ID }}" ] || [ -z "${{ secrets.TCB_SECRET_KEY }}" ]; then
            echo "has_tcb=false" >> "$GITHUB_OUTPUT"
            echo "未配置 TCB_ENV / TCB_SECRET_ID / TCB_SECRET_KEY，跳过云数据库同步"
            echo "（小程序仍会打包最新数据，但要重新上传版本才能看到）"
            exit 0
          fi
          echo "has_tcb=true" >> "$GITHUB_OUTPUT"
          npm install @cloudbase/node-sdk --no-audit --no-fund
          TCB_ENV="${{ secrets.TCB_ENV }}" \
          TCB_SECRET_ID="${{ secrets.TCB_SECRET_ID }}" \
          TCB_SECRET_KEY="${{ secrets.TCB_SECRET_KEY }}" \
          node scripts/push_to_cloud.js

      - name: 提交数据变更
        if: steps.guard.outputs.degraded != 'true'
        run: |
          git config user.name "qingjiao-bot"
          git config user.email "qingjiao-bot@users.noreply.github.com"
          git add utils/data_crawl.js docs/data/notices.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(data): 每日抓取更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
          # 运行期间远端可能又有提交，重试 3 次
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "提交成功"
              break
            fi
            echo "推送失败，第 $i 次重试..."
            sleep 5
          done

      - name: 检查上传密钥
        id: key
        run: |
          if [ -n "${{ secrets.MP_UPLOAD_KEY }}" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "未配置 MP_UPLOAD_KEY，本次只更新数据、不上传"
          fi

      - name: 安装上传依赖
        if: steps.key.outputs.has_key == 'true'
        run: npm install miniprogram-ci --no-audit --no-fund

      - name: 自动上传体验版
        if: steps.key.outputs.has_key == 'true'
        env:
          MP_UPLOAD_KEY: ${{ secrets.MP_UPLOAD_KEY }}
        run: node scripts/upload_ci.js
