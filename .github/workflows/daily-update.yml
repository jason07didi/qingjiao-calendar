name: 每日抓取科研通知

# 流程：抓官方列表页 → 生成小程序包内数据 → 提交 → （可选）自动上传体验版
#
# 说明：
#  - 小程序正式版不能 wx.request 到 github.io（域名未 ICP 备案），
#    所以数据不"实时拉取"，而是打进包随版本更新。
#  - 截止日铁律：列表页日期是「发布日」，不是「截止日」，
#    抓到的条目 deadline 一律留空，落在首页「日期待定」段，等人工核实。

on:
  # 每天北京时间 07:30（GitHub cron 用 UTC，07:30 CST = 前一日 23:30 UTC）
  schedule:
    - cron: "30 23 * * *"

  # 支持手动触发（改完爬虫逻辑想立刻验证时用）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-crawl
  cancel-in-progress: true

jobs:
  crawl-and-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 抓取官方通知列表页
        run: node tools/local_spider.js

      - name: 生成小程序包内数据
        run: node tools/build_pack.js

      - name: 检查生成结果
        run: |
          if [ ! -f "utils/data_crawl.js" ]; then
            echo "ERROR: utils/data_crawl.js 未生成"
            exit 1
          fi
          node -e "const d=require('./utils/data_crawl.js');console.log('整理日期',d.UPDATED_AT,'条目',(d.ITEMS||[]).length)"

      - name: 提交数据变更
        run: |
          git config user.name "qingjiao-bot"
          git config user.email "qingjiao-bot@users.noreply.github.com"
          git add utils/data_crawl.js
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(data): 每日抓取更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
          # 运行期间远端可能又有提交，重试 3 次
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "提交成功"
              break
            fi
            echo "推送失败，第 $i 次重试..."
            sleep 5
          done

      - name: 检查上传密钥
        id: key
        run: |
          if [ -n "${{ secrets.MP_UPLOAD_KEY }}" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "未配置 MP_UPLOAD_KEY，本次只更新数据、不上传"
          fi

      - name: 安装上传依赖
        if: steps.key.outputs.has_key == 'true'
        run: npm install miniprogram-ci --no-audit --no-fund

      - name: 自动上传体验版
        if: steps.key.outputs.has_key == 'true'
        env:
          MP_UPLOAD_KEY: ${{ secrets.MP_UPLOAD_KEY }}
        run: node scripts/upload_ci.js
